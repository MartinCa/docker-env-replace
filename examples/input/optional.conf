# envreplace demo: explicit empty replacement.
#
# TLS_ENABLED is referenced below. If the output value should be
# empty, TLS_ENABLED must be set to the empty sentinel (default
# "(empty)"). If TLS_ENABLED is unset, or is set to the empty string,
# envreplace fails with an error identifying the variable and file.
#
#   TLS_ENABLED="(empty)"  ->  flagssl = l
#   TLS_ENABLED=true       ->  flagssl = truel
#   TLS_ENABLED=           ->  error (set-but-empty is not allowed)
#   (unset)                ->  error (missing variable)
#
# The sentinel value is configurable via ENVREPLACE_EMPTY_VALUE.
flagssl = <TLS_ENABLED>l
