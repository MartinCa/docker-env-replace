name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.23
          cache: false
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Format check
        run: test -z "$(gofmt -l .)"

  docker:
    runs-on: ubuntu-latest
    needs: test
    # actions: write lets the GHA buildx cache backend write cache
    # entries; the cache itself is exported via actions/cache under the
    # hood.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: envreplace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max